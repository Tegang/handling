<style>
  * { 
    box-sizing: border-box; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  }

  body { 
    background-color: #f4f4f9; 
    margin: 0; 
    padding: 8px 15px 15px 15px; 
    color: #333; 
    font-size: 17px; /* Höjd grundstorlek för bättre läsbarhet */
  }

  h1 { 
    text-align: center; 
    color: #2c3e50; 
    font-size: 22px; 
    margin: 0 0 8px 0; 
    line-height: 1.2; 
  }

  .card { 
    background: white; 
    padding: 16px; 
    border-radius: 12px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
    margin-bottom: 15px; 
  }

  .input-group { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 10px; 
  }

  input[type="text"] { 
    flex: 1; 
    padding: 12px; 
    border: 1px solid #ddd; 
    border-radius: 8px; 
    font-size: 17px; 
  }

  button { 
    background: #e10011; 
    color: white; 
    border: none; 
    padding: 13px 18px; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 16px; 
  }

  button:active { 
    opacity: 0.8; 
  }

  button:disabled {
    background: #ccc !important;
    color: #777 !important;
    cursor: not-allowed !important;
    opacity: 0.6 !important;
    box-shadow: none !important;
    border: none !important;
  }

  button.secondary {
    background: #666;
  }

  button.outline { 
    background: transparent; 
    color: #e10011; 
    border: 2px solid #e10011; 
    width: 100%; 
    margin-top: 10px; 
  }

  .file-btn { 
    background: #28a745; 
    text-align: center; 
    display: block; 
    width: 100%; 
    padding: 13px; 
    border-radius: 8px; 
    color: white; 
    font-weight: bold; 
    cursor: pointer; 
  }

  input[type="file"] { 
    display: none; 
  }

  .item-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 14px 0; 
    border-bottom: 1px solid #eee; 
    /* Förhindrar textmarkering och "Sök/Översätt"-popups vid klick/touch */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .item-row:last-child { 
    border-bottom: none; 
  }

  .item-left { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
  }

  input[type="checkbox"] { 
    width: 24px; 
    height: 24px; 
    accent-color: #e10011; 
  }

  .item-text { 
    font-size: 18px; 
    font-weight: 500;
  }

  .item-avd { 
    font-size: 13px; 
    font-weight: 600;
    color: #444;
    background: #e5e5ea;
    padding: 4px 9px;
    border-radius: 6px; 
    margin-left: 8px; 
    display: inline-block;
    letter-spacing: 0.2px;
  }

  .item-info {
    display: block;
    font-size: 15px; 
    color: #666;
    font-style: italic;
    margin-top: 4px;
    line-height: 1.3;
  }

  .done { 
    opacity: 0.45; 
  }

  .done .item-text { 
    text-decoration: line-through; 
    color: #777; 
  }

  .done .item-avd { 
    opacity: 0.6;
    background: #e0e0e0;
  }

  .done .item-info {
    text-decoration: line-through;
    color: #888;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #bbb;
    font-size: 18px; 
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
  }

  .delete-btn:active {
    color: #e10011;
    background-color: #ffe6e6;
  }

  /* --- LÄGESVÄLJARE --- */
  .mode-switcher {
    display: flex;
    padding: 4px;
    background: #e0e0e5;
    border-radius: 10px;
    gap: 4px;
  }

  .mode-btn {
    flex: 1;
    background: transparent;
    color: #666;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px; 
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mode-btn.active {
    background: white;
    color: #e10011;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  .selected-list-row {
    border: 2px solid #e10011 !important;
    border-radius: 10px;
    background-color: #fff8f8 !important;
    padding: 12px 14px !important;
  }

  /* --- SPINNER --- */
  #loadingOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #e10011;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* --- MODALA FÖNSTER - EXTRA STORA OCH TYDLIGA TEXTER --- */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }

  .modal-box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    width: 92%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.2);
    animation: modalPop 0.2s ease-out;
  }

  @keyframes modalPop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-box h3 {
    margin-top: 0;
    margin-bottom: 14px;
    font-size: 24px; 
    font-weight: 700;
    color: #2c3e50;
  }

  .modal-box p {
    font-size: 18px; 
    color: #444;
    margin-bottom: 20px;
    line-height: 1.45;
  }

  .modal-box label {
    font-size: 16px !important; 
    font-weight: 600;
  }

  .modal-box input[type="text"],
  .modal-box select {
    font-size: 18px !important; 
    padding: 12px !important;
  }

  .modal-buttons {
    display: flex;
    gap: 12px; /* Skapar ett tydligt avstånd mellan Avbryt och OK/Spara */
    margin-top: 15px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 14px;
    font-size: 17px; 
    font-weight: bold;
  }

  #modalInput {
    font-size: 18px !important;
    padding: 12px !important;
  }

  /* --- TOPPRAD (HEADER) --- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px !important;
    margin-bottom: 12px !important;
    background: white;
  }

  .header-title {
    font-size: 21px !important; 
    margin: 0 !important;
    color: #2c3e50;
    font-weight: 700;
  }

  .header-btn {
    background: transparent !important;
    color: #2c3e50 !important;
    font-size: 24px !important;
    padding: 4px 8px !important;
    border: none !important;
    cursor: pointer;
    line-height: 1;
    border-radius: 6px;
  }

  /* --- SIDOMENY (DRAWER) --- */
  .sidenav-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 10001;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .sidenav-backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  .sidenav-drawer {
    position: fixed;
    top: 0;
    left: 0;
    width: 290px;
    max-width: 85vw;
    height: 100%;
    background: white;
    z-index: 10002;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }

  .sidenav-drawer.active {
    transform: translateX(0);
  }

  .sidenav-header {
    background: #2c3e50;
    color: white;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidenav-header h3 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: white !important;
  }

  .close-nav-btn {
    background: transparent !important;
    border: none !important;
    color: white !important;
    font-size: 22px !important;
    cursor: pointer;
    padding: 4px 8px !important;
    border-radius: 6px;
    line-height: 1;
    opacity: 0.85;
    box-shadow: none !important;
    transition: opacity 0.2s, background-color 0.2s;
  }

  .close-nav-btn:active {
    opacity: 1;
    background-color: rgba(255, 255, 255, 0.15) !important;
  }

  .sidenav-menu {
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidenav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: #333;
    font-size: 17px;
    font-weight: 600;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
  }

  .sidenav-item:active, .sidenav-item.active {
    background: #f0f0f5;
    color: #e10011;
  }

  .sidenav-divider {
    height: 1px;
    background: #eee;
    margin: 12px 8px 6px 8px;
  }

  .sidenav-section-title {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.8px;
    padding: 10px 16px 4px 16px; 
    text-transform: uppercase;
  }

  /* --- BUTIKSHANTERING & PILKNAPPAR --- */
  .sort-btn {
    background: #f0f0f5 !important;
    color: #2c3e50 !important;
    border: 1px solid #ccc !important;
    padding: 8px 12px !important;
    border-radius: 6px !important;
    font-size: 15px !important;
  }

  .sort-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #fdfdfd;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 6px;
  }

  /* --- KLICKBARA & RÖDA AVDELNINGSBANNERS --- */
  .item-avd.clickable {
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .item-avd.clickable:active {
    transform: scale(0.95);
    opacity: 0.8;
  }

  .item-avd.missing-avd {
    background: #ffe6e6 !important;
    color: #e10011 !important;
    border: 1px solid #ffb3b3 !important;
    font-weight: bold !important;
  }

  /* --- CUSTOM VARUVÄLJARE (PICKER) STILAR --- */
  .picker-cat-header {
    background-color: #3c4b5d;
    color: #ffffff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.6px;
    padding: 8px 12px;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .picker-item-row {
    padding: 14px 16px;
    font-size: 17px; 
    color: #333;
    background-color: #ffffff;
    border-bottom: 1px dotted #e0e0e0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.15s ease;
  }

  .picker-item-row:last-child {
    border-bottom: none;
  }

  .picker-item-row:active {
    background-color: #f0f0f5;
  }

  .picker-new-btn {
    font-weight: bold;
    color: #e10011;
    background-color: #fff8f8;
    border-bottom: 2px solid #ffe0e0;
  }

  /* --- ALLA DROPDOWN-LISTOR (SELECT / OPTION) --- */
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    font-weight: 500;
    color: #2c3e50;
    background-color: #ffffff;
    outline: none;
    box-sizing: border-box;
    cursor: pointer;
  }

  optgroup {
    font-weight: 700;
    background-color: #3c4b5d;
    color: #ffffff;
    font-size: 13px;
    padding: 6px 10px;
    text-transform: uppercase;
  }

  option {
    background-color: #ffffff;
    color: #333333;
    padding: 10px 12px;
    font-size: 16px;
    border-bottom: 1px dotted #e0e0e0;
  }

  /* --- MÖRKT TEMA (DARK MODE) --- */
  body.dark-theme {
    background-color: #121212 !important;
    color: #e0e0e0 !important;
  }

  body.dark-theme .card,
  body.dark-theme .modal-box,
  body.dark-theme .sidenav-drawer,
  body.dark-theme .app-header {
    background-color: #1e1e1e !important;
    color: #e0e0e0 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5) !important;
  }

  body.dark-theme h1,
  body.dark-theme h2,
  body.dark-theme h3,
  body.dark-theme label,
  body.dark-theme strong,
  body.dark-theme .header-title,
  body.dark-theme .header-btn {
    color: #ffffff !important;
  }

  body.dark-theme input[type="text"],
  body.dark-theme select {
    background-color: #2a2a2a !important;
    color: #ffffff !important;
    border-color: #444 !important;
  }

  body.dark-theme .item-row {
    border-bottom-color: #333 !important;
  }

  body.dark-theme .item-avd {
    background: #333 !important;
    color: #ccc !important;
  }

  body.dark-theme .sort-row {
    background: #252525 !important;
    border-color: #3d3d3d !important;
  }

  body.dark-theme .mode-switcher {
    background: #2a2a2a !important;
  }

  body.dark-theme .mode-btn {
    color: #aaa !important;
  }

  body.dark-theme .mode-btn.active {
    background: #3a3a3a !important;
    color: #ff4d4d !important;
  }

  body.dark-theme .selected-list-row {
    background-color: #2b1f1f !important;
    border-color: #e10011 !important;
  }

  body.dark-theme .sidenav-drawer {
    background: #1e1e1e !important;
    color: #e0e0e0 !important;
  }

  body.dark-theme .sidenav-header {
    background: #151d27 !important;
  }

  body.dark-theme .sidenav-item {
    color: #e0e0e0 !important;
  }

  body.dark-theme .sidenav-item:active,
  body.dark-theme .sidenav-item.active {
    background: #2a2a2a !important;
    color: #ff4d4d !important;
  }

  body.dark-theme .sidenav-divider {
    background: #333 !important;
  }

  body.dark-theme .sidenav-section-title {
    color: #aaa !important;
  }

  body.dark-theme .picker-cat-header {
    background-color: #1c2733 !important;
    color: #ffffff !important;
  }

  body.dark-theme .picker-item-row {
    background-color: #2a2a2a !important;
    color: #ffffff !important;
    border-bottom-color: #444 !important;
  }

  body.dark-theme .picker-new-btn {
    background-color: #2b1f1f !important;
    color: #ff4d4d !important;
    border-bottom-color: #3d2a2a !important;
  }

  body.dark-theme #loadingOverlay {
    background-color: rgba(18, 18, 18, 0.9) !important;
  }

  .om-version-box {
    background: #f0f0f5;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-top: 10px;
  }

  body.dark-theme .om-version-box {
    background: #2a2a2a !important;
  }

  #customModal {
    z-index: 20000 !important;
  }

  /* --- SPÄRR FÖR LANDSKAPSLÄGE PÅ MOBILER --- */
@media screen and (orientation: landscape) and (max-height: 550px) {
  body::before {
    content: "📱 Vänligen rotera mobilen till stående läge";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #2c3e50;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    z-index: 999999;
  }

  /* Döljer allt innehåll när mobilen ligger ner */
  body > * {
    display: none !important;
  }
}
</style>
